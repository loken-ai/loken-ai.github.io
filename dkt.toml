[data.mark]
light = "/mark/mark-light.svg"
dark = "/mark/mark-dark.svg"

[data.hero]
logo = { light = "/brand/loken-light.svg", dark = "/brand/loken-dark.svg" }
lede = "A full-Rust inference stack that runs language and generative-media models on your own machine. One server speaks the OpenAI, Ollama and Anthropic APIs and calls nothing out."

[data]
repo = "https://github.com/loken-ai/loken-ai.github.io"

[data.sites.lokode]
title = "lokode"
tag = "Experimental"
lede = "A coding agent in the terminal, against a model on your own machine. It needs no account, sends no request off the machine and asks you to adopt no editor."
install = "cargo install --path ."
primary = { label = "Read the documentation", url = "/lokode/overview/" }
secondary = { label = "Take the tour", url = "/lokode/using/" }
start = [
  { label = "Read the overview", text = "What lokode does, and how to install it.", url = "/lokode/overview/" },
  { label = "Take the tour of the screen", text = "The conversation, the rail and the keys.", url = "/lokode/using/" },
  { label = "What is and is not enforced", text = "Approvals, the sandbox and what they leave open.", url = "/lokode/security/" },
]
facts = ["loken, ollama, vLLM, llama.cpp", "17 providers by name", "Sandboxed commands", "Zed, JetBrains, Neovim, Emacs, VS Code"]
images = "/lokode/img/"
ways_title = "One engine, 4 ways in"
slides = [
  { name = "session-120", title = "A session", caption = "In the middle of a turn: the conversation, a change waiting for you, and the rail with the plan, the changes and the engine" },
  { name = "complete-command-120", title = "Commands", caption = "A command is completed as you type it, in the terminal" },
  { name = "delegate-120", title = "Agents", caption = "A task handed to an agent, its steps folded under it" },
  { name = "web-approval", title = "In a browser", caption = "The same engine in a browser: a change waits for an answer, with its diff" },
  { name = "help-120", title = "Help", caption = "The commands and the keys, on a page of their own" },
]
ways = [
  { title = "In the terminal", text = "The screen, the rail and the approvals.", command = "lokode", url = "/lokode/using/" },
  { title = "In an editor", text = "Zed, JetBrains, Neovim, Emacs and VS Code.", command = "lokode acp", url = "/lokode/interfaces/" },
  { title = "In a browser", text = "A page on this machine, behind a token.", command = "lokode serve", url = "/lokode/interfaces/#in-a-browser" },
  { title = "Attached", text = "A terminal on a session that is running.", command = "lokode attach", url = "/lokode/interfaces/#in-the-terminal" },
]

[data.sites.loken]
title = "loken"
lede = "A local inference server for language and generative-media models. One process serves chat, images, audio, speech, transcription and video over the OpenAI, Ollama and Messages APIs."
install = "cargo build --release"
primary = { label = "Read the documentation", url = "/loken/overview/" }
secondary = { label = "Install", url = "/loken/install/" }
start = [
  { label = "Read the overview", text = "What loken serves, and in which state.", url = "/loken/overview/" },
  { label = "Install", text = "Build the 2 binaries from source.", url = "/loken/install/" },
  { label = "Run the first model", text = "Start the daemon, pull a model, get an answer.", url = "/loken/first-run/" },
  { label = "See how lokend works", text = "The way of a request, part by part, one figure each.", url = "/loken/map/" },
  { label = "Learn how inference works", text = "10 lessons, with exercises and quizzes.", url = "/loken/learn/" },
]
facts = ["Inference never leaves the machine", "OpenAI, Ollama and Messages APIs", "Language, image, audio and video", "Energy reported beside speed"]
images = "/loken/img/"
ways_title = "What to do with it"
slides = [
  { file = "anatomy-overview.svg", title = "The daemon", caption = "lokend drawn on a body: each region does one part of the work" },
  { file = "learn-layer.svg", title = "A layer", caption = "One decoder layer: what it reads and what it keeps" },
  { file = "learn-placement.svg", title = "Placement", caption = "2 ways to spill a mixture that does not fit on the cards" },
  { file = "learn-kv-tiers.svg", title = "KV cache", caption = "Where a conversation's KV lives, from the card to the disk" },
]
ways = [
  { title = "Serve a chat model", text = "Any OpenAI client works unchanged.", command = "lokend serve", url = "/loken/openai-sdk/" },
  { title = "Keep your Ollama clients", text = "The Ollama API on the same port.", command = "/api/chat", url = "/loken/ollama-clients/" },
  { title = "Run a coding agent", text = "Claude Code or Cline on loken.", command = "loken launch claude", url = "/loken/agents/" },
  { title = "Generate images", text = "Images, edits and variations.", command = "/v1/images/generations", url = "/loken/images/" },
  { title = "Transcribe and speak", text = "Speech to text and back.", command = "/v1/audio/speech", url = "/loken/speech/" },
  { title = "Use 2 machines", text = "Spread work across 2 nodes.", command = "[cluster]", url = "/loken/cluster/" },
]

