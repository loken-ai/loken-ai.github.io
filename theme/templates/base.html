<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ page.title }} - {{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ page.description or site.description }}">
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/loken-ai/.github/main/brand/favicon.svg">
<script>try{var t=localStorage.getItem("loken-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="{{ site.base_path }}/theme.css">
</head>
<body class="ground">
<header class="top"><div class="wrap">
<a class="brand" href="{{ site.base_path }}/"><img src="https://raw.githubusercontent.com/loken-ai/.github/main/brand/icon.svg" alt="" width="34" height="34"><span><b>{{ site.title }}</b></span></a>
<nav>{% for n in nav %}<a href="{{ n.url }}"{% if n.current %} aria-current="page"{% endif %}>{{ n.name }}</a>{% endfor %}</nav>
<a class="gh" href="{{ site.repo }}">GitHub</a>
<button type="button" class="theme-toggle" aria-label="Switch theme" aria-pressed="false">
<svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
</div></header>
{% block main %}{% endblock %}
<footer><div class="wrap"><a href="/">loken-ai.github.io</a><span>{{ site.title }}</span><a href="{{ site.repo }}">{{ site.repo | replace("https://", "") }}</a></div></footer>
<script>
document.querySelectorAll(".prose td:first-child").forEach(function (td) {
  if (td.textContent.trim().length <= 30) td.classList.add("k");
});
</script>
<script src="{{ site.base_path }}/theme.js"></script>
{% block script %}{% endblock %}
</body>
</html>
