{# slides: a list of name and caption. images: the address the images are served at, ending with a slash. #}
{% set images = images or (site.base_path ~ "/img/") %}
<div class="carousel" role="region" aria-roledescription="carousel" aria-label="{{ carousel_label or 'Screens' }}">
<div class="track" tabindex="0">
{% for s in slides %}<div class="slide" role="group" aria-roledescription="slide" aria-label="{{ loop.index }} of {{ slides | length }}"><figure class="shot"><button type="button" class="zoom" aria-label="Enlarge: {{ s.caption }}"><picture><source media="(prefers-color-scheme: dark)" srcset="{{ images }}{{ s.name }}-dark.png"><img src="{{ images }}{{ s.name }}-light.png" alt="{{ s.caption }}"{% if loop.index > 3 %} loading="lazy"{% endif %}></picture></button><figcaption>{{ s.caption }}</figcaption></figure></div>
{% endfor %}
</div>
<div class="controls">
<button type="button" class="prev" aria-label="Previous screens"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<span class="dots"></span>
<button type="button" class="next" aria-label="Next screens"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<button type="button" class="toggle" aria-label="Pause the automatic scroll" data-state="playing"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="i-pause" d="M8 5v14M16 5v14"/></svg><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="i-play" d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
</div></div>
<dialog class="lightbox" aria-label="Enlarged screen"><img alt=""></dialog>
<script src="{{ site.base_path }}/carousel.js"></script>
