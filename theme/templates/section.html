{% extends "base.html" %}
{% block title %}{{ section.title }} - {{ site.title }}{% endblock %}
{% block main %}
<main class="wrap"><div class="prose">
<h1>{{ section.title }}</h1>
<div class="cards">
{% for p in section.pages %}<article class="card read"><h3 class="title"><a href="{{ p.url }}">{{ p.title }}</a></h3>{% if p.description %}<p>{{ p.description }}</p>{% endif %}</article>
{% endfor %}
</div>
</div></main>
{% endblock %}
